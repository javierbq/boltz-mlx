name: BoltzMLXDemo
options:
  deploymentTarget:
    iOS: "17.0"
packages:
  BoltzMLX:
    path: ../..
targets:
  BoltzMLXDemo:
    type: application
    platform: iOS
    sources:
      - BoltzMLXDemoApp.swift
      - PredictionView.swift
      - PredictionViewModel.swift
      - BenchmarkRunner.swift
    dependencies:
      - package: BoltzMLX
        product: BoltzMLX
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: io.github.javierbq.boltzmlx
        PRODUCT_NAME: BoltzMLXDemo
        SWIFT_VERSION: 6.0
        GENERATE_INFOPLIST_FILE: YES
        TARGETED_DEVICE_FAMILY: "1,2"
        INFOPLIST_KEY_UIFileSharingEnabled: YES
        INFOPLIST_KEY_LSSupportsOpeningDocumentsInPlace: YES
